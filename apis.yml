apis:
  - aid: shopware:admin-api
    name: Shopware Admin API
    description: >-
      The Admin API provides programmatic access to all back-office and
      administrative operations in Shopware 6, including product management,
      order processing, customer data, indexing, and configuration. It uses
      OAuth 2.0 authentication and publishes an OpenAPI 3 specification at
      /api/_info/openapi3.json on every running instance.
    humanURL: https://shopware.stoplight.io/docs/admin-api
    baseURL: https://{your-shop-domain}/api
    tags:
      - Admin
      - E-Commerce
      - OAuth2
      - REST
    properties:
      - type: Documentation
        url: https://shopware.stoplight.io/docs/admin-api
      - type: OpenAPI
        url: https://raw.githubusercontent.com/shopware/admin-api-reference/main/adminapi.json
      - type: OpenAPI
        url: openapi/shopware-admin-api-openapi.yml
  - aid: shopware:store-api
    name: Shopware Store API
    description: >-
      The Store API is the customer-facing API for Shopware 6, designed for
      building headless storefronts and progressive web apps. It exposes
      endpoints for product catalog browsing, cart management, checkout,
      customer authentication, and order history. The API is publicly
      accessible for catalog data and requires contextual headers for
      customer-specific operations.
    humanURL: https://shopware.stoplight.io/docs/store-api
    baseURL: https://{your-shop-domain}/store-api
    tags:
      - Storefront
      - Headless Commerce
      - REST
      - E-Commerce
    properties:
