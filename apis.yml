---
aid: shopware
name: Shopware
description: >-
  Shopware is an open-source, API-first e-commerce platform built on Symfony and
  Vue.js, serving mid-market and enterprise merchants across B2C, D2C, and B2B use
  cases. The platform exposes two primary HTTP APIs: an Admin API for back-office
  integrations and automation, and a Store API for building headless customer-facing
  storefronts. Both APIs publish machine-readable OpenAPI 3 specifications directly
  from each running instance. Shopware is available as a free Community Edition
  (MIT-licensed), and as paid SaaS and self-hosted tiers (Rise, Evolve, Beyond)
  unlocking additional commerce capabilities.
